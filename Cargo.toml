[package]
name = "gol"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gol"

[dependencies]
rayon = "1.10"
rustc-hash = "2.0"
arc-swap = "1.7"
bytemuck = { version = "1.18", features = ["derive"] }
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
pollster = "1.0"
wgpu = "27"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
